<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sanskar 💗 Fahima</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
color:white;
text-align:center;
background:linear-gradient(135deg,#ff4b6e,#ff9a9e);
overflow:hidden;
}

/* Screens */
.screen{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
padding:20px;
position:relative;
z-index:2;
}

/* Card */
.card{
background:rgba(255,255,255,0.12);
padding:30px;
border-radius:25px;
max-width:750px;
width:100%;
backdrop-filter:blur(5px);
}

/* Button */
.btn{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
background:white;
color:#ff4b6e;
}

.glow{
animation:glow 2s infinite alternate;
}
@keyframes glow{
from{text-shadow:0 0 5px pink;}
to{text-shadow:0 0 20px white;}
}

/* Balloon */
.balloon{font-size:50px;cursor:pointer;margin:5px;}

/* Slider */
.slider{width:250px;}
.target{
width:60px;
height:6px;
background:white;
margin:5px auto;
border-radius:5px;
}

/* Letter */
.letter{
text-align:left;
line-height:1.7;
font-size:20px;
white-space:pre-line;
}
.letter h2{margin:0 0 8px 0;}
.letter p{margin:4px 0;}

/* MAIN */
#main{
display:none;
padding:30px;
position:relative;
z-index:2;
}

/* Final Page Typing Bigger */
#typing{
font-size:22px;
line-height:1.8;
}

/* PHOTO RAIN */
#photoRain{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
overflow:hidden;
perspective:900px;
display:none;
}

.rainPhoto{
position:absolute;
border-radius:15px;
opacity:0.95;
box-shadow:0 12px 30px rgba(0,0,0,0.4);
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-150px) rotateY(0deg);
opacity:0;
}
10%{opacity:1;}
100%{
transform:translateY(110vh) rotateY(360deg);
opacity:0;
}
}

</style>
</head>

<body>

<!-- PHOTO RAIN -->
<div id="photoRain"></div>

<audio id="music" src="song.mp3" loop></audio>

<!-- PASSWORD -->
<div id="passPage" class="screen">

<div class="card">

<h1 class="glow">🔐 Secret Entry</h1>

<input id="pass" type="password" placeholder="Password"><br><br>

<button class="btn" onclick="checkPass()">Enter ❤️</button>

<p id="passMsg"></p>

</div>
</div>

<!-- START -->
<div id="startPage" class="screen" style="display:none;">

<div class="card">

<h1 class="glow">💝 Here's Your Surprise</h1>

<button class="btn" onclick="goBalloon()">Let's Start 🚀</button>

</div>
</div>

<!-- BALLOON -->
<div id="balloonPage" class="screen" style="display:none;">

<h1>🎈 Pop 5 Balloons</h1>

<div id="balloons"></div>

<p id="balloonMsg"></p>

</div>

<!-- SLIDER -->
<div id="sliderPage" class="screen" style="display:none;">

<h1>💘 Balance My Heart</h1>
<p>Bring ❤️ to center</p>

<div class="target"></div>

<input type="range" min="0" max="100" value="0"
class="slider" id="loveSlider">

<p id="sliderMsg"></p>

</div>

<!-- QUIZ -->
<div id="quizPage" class="screen" style="display:none;">

<div class="card">

<h1>🧠 Love Quiz</h1>

<p>Who is my forever?</p>

<button class="btn" onclick="quizRight()">Fahima ❤️</button>
<button class="btn" onclick="quizWrong()">Anyone 😅</button>

<p id="quizMsg"></p>

</div>
</div>

<!-- RING -->
<div id="ringPage" class="screen" style="display:none;">

<h1>💍 Find The Ring</h1>

<button class="btn" onclick="findRing(1)">Box 1</button>
<button class="btn" onclick="findRing(2)">Box 2</button>
<button class="btn" onclick="findRing(3)">Box 3</button>

<p id="ringMsg"></p>

</div>

<!-- LETTER -->
<div id="letterPage" class="screen" style="display:none;">

<div class="card letter">

<h2>My Dearest Chikudiii 💕</h2>

<p id="letterText"></p>

</div>

<button class="btn" onclick="goMain()">Continue 💖</button>

</div>

<!-- MAIN -->
<div id="main">

<h1 class="glow">To My Prettiest Wife 😘❤️</h1>

<p id="typing"></p>

<footer>I Love You Forever 😘❤️</footer>

</div>

<script>

/* PHOTO RAIN */
let rainInterval=null;

const photos=[
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg"
];

function startRain(){

const rain=document.getElementById("photoRain");
rain.style.display="block";

if(rainInterval) return;

rainInterval=setInterval(createRain,600);
}

function createRain(){

const rain=document.getElementById("photoRain");

const img=document.createElement("img");
img.className="rainPhoto";

img.src=photos[Math.floor(Math.random()*photos.length)];
img.style.left=Math.random()*100+"vw";
img.style.width=120+Math.random()*60+"px";
img.style.animationDuration=6+Math.random()*5+"s";

rain.appendChild(img);

setTimeout(()=>img.remove(),13000);
}

/* PASSWORD */
function checkPass(){

if(pass.value==="love123"){

hideAll();
startPage.style.display="flex";

}else passMsg.innerHTML="❌ Wrong Password";
}

/* BALLOON */
let popped=0;

function goBalloon(){

hideAll();
balloonPage.style.display="flex";

balloons.innerHTML="";
popped=0;
balloonMsg.innerHTML="";

for(let i=0;i<7;i++){

const b=document.createElement("span");
b.className="balloon";
b.innerHTML="🎈";

b.onclick=function(){

this.remove();
popped++;

if(popped>=5){
balloonMsg.innerHTML="😍 You Won!";
setTimeout(goSlider,1200);
}
};

balloons.appendChild(b);
}
}

/* SLIDER */
function goSlider(){

hideAll();
sliderPage.style.display="flex";

loveSlider.value=0;
sliderMsg.innerHTML="";
}

loveSlider.oninput=function(){

const v=parseInt(this.value);

if(v>45 && v<55){

sliderMsg.innerHTML="💖 Perfect Balance!";
setTimeout(goQuiz,1000);
}
};

/* QUIZ */
function goQuiz(){

hideAll();
quizPage.style.display="flex";
quizMsg.innerHTML="";
}

function quizRight(){

quizMsg.innerHTML="😍 Correct!";
setTimeout(goRing,1200);
}

function quizWrong(){

quizMsg.innerHTML="😅 Try Again!";
}

/* RING */
const ringBox=2;

function goRing(){

hideAll();
ringPage.style.display="flex";
ringMsg.innerHTML="";
}

function findRing(n){

if(n===ringBox){

ringMsg.innerHTML="💍 Yeahhh! We Will Get Married 😍❤️";
setTimeout(goLetter,1500);

}else ringMsg.innerHTML="😅 Wrong Box!";
}

/* LETTER */
function goLetter(){

hideAll();
letterPage.style.display="flex";

music.play();
startLetterTyping();
}

/* MAIN */
function goMain(){

hideAll();
main.style.display="block";

startRain();
typeWriter();
}

/* HIDE */
function hideAll(){

document.querySelectorAll(".screen,#main").forEach(el=>{
el.style.display="none";
});
}

/* FINAL PAGE TYPING (Gujarati Feel in English) */
const text=`

My Pyari Chikudiii ❤️,

Tame mari khushi chho,
tame mari duniya chho,
ane mari smile chho.


Jare pan hu tane jovu,
maru dil shant thai jaye chhe.
Tame mara jivan no
sab thi sundar hissa chho.


Hu hamesha tane prem karto rahish,
taro sath kyarey nahi chhodish,
ane tari sathe jivish.


Tame mari forever chho 💍💖
`;

let i=0;

function typeWriter(){

if(i<text.length){

typing.innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,70);
}
}

/* LETTER TYPING (English Letter) */
const letterMessage = `
My Dearest Chikudiii ❤️,

From the first day you came into my life,
everything changed beautifully.
You became my smile, my peace,
and my biggest blessing.

With you, every little moment feels special.
Your laughter makes my world brighter,
your presence makes my heart calm.

I promise to love you forever,
to respect you,
and to stand by your side in every situation.

No matter where life takes us,
I will always choose you.

Forever Yours,
Sanskar ❤️
`;

let letterIndex=0;

function startLetterTyping(){

letterIndex=0;
letterText.innerHTML="";
typeLetter();
}

function typeLetter(){

if(letterIndex < letterMessage.length){

letterText.innerHTML += letterMessage.charAt(letterIndex);

letterIndex++;

setTimeout(typeLetter,40);
}
}

</script>

</body>
</html>
